name: Build, Test and Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx svelte-check --tsconfig ./tsconfig.json

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish production build to GitHub Pages
        if: runner.os == 'Linux'
        uses: peaceiris/actions-gh-pages@1ef5a1b1df4c63fe21a2242edbee6cac921ece01 # v4.1.0
        with:
          personal_token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          external_repository: ajjs1ajjs/Gym
          publish_dir: ./dist
          publish_branch: gh-pages
