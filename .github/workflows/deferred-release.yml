name: Deferred release (Oct 1)

on:
  schedule:
    - cron: '0 6 1 10 *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deferred-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # merge holding branch, push tag, create release
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Merge holding branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/deferred-oct-release
          git merge --ff-only origin/codex/deferred-oct-release
          git push origin main

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.version.outputs.version }}"
          git tag "v$VER" || echo "tag exists"
          git push origin "v$VER" || echo "tag already pushed"
          gh release create "v$VER" --title "v$VER" --generate-notes || echo "release exists"
