    <text x="60" y="21" font-family="Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#c084fc" text-anchor="middle">−4 кг</text>
    <text x="60" y="42" font-family="Segoe UI, sans-serif" font-size="12" fill="#9aa0c0" text-anchor="middle">за 10 тижнів</text>
