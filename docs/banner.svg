  <text x="356" y="150" font-family="Segoe UI, sans-serif" font-size="62" font-weight="700" fill="#ffffff" filter="url(#textGlow)">Gym <tspan fill="url(#brand)">Tracker</tspan></text>
  <text x="360" y="198" font-family="Segoe UI, sans-serif" font-size="23" fill="#9aa0c0">Щоденні тренування · контроль ваги · офлайн PWA</text>

  <g transform="translate(356,240)">
